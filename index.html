<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7efe9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Bloom">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Bloom</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7efe9; --paper:#fffbf8; --ink:#35423a; --mut:#8c8a7c; --line:#e9ddd2;
  --sage:#7d9380; --sage-d:#55705c; --rose:#cf9b95; --rose-l:#f4e0db; --gold:#b9955b; --gold-l:#f2e6cf;
  --serif:'Cormorant Garamond',Georgia,serif; --sans:'Jost',system-ui,-apple-system,sans-serif;
  --sb:env(safe-area-inset-bottom,0px); --st:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-weight:400;font-size:15px;line-height:1.45;min-height:100vh;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
input,select,textarea{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:10px 12px;outline:none;font-size:16px}
input:focus,select:focus,textarea:focus{border-color:var(--sage)}
textarea{resize:vertical;min-height:70px}
h1,h2,h3{font-family:var(--serif);font-weight:600;margin:0;letter-spacing:.2px}
.ic{display:inline-block;vertical-align:middle;flex:none}
.mut{color:var(--mut)}.sm{font-size:.82rem}
.cap{font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);font-weight:500}

/* decorative botanicals */
.deco{position:fixed;pointer-events:none;z-index:0}
.deco.a{right:-30px;top:60px;opacity:.16;transform:rotate(18deg)}
.deco.b{left:-40px;bottom:90px;opacity:.12;transform:rotate(-24deg) scaleX(-1)}

#app{position:relative;z-index:1;max-width:720px;margin:auto;padding:calc(18px + var(--st)) 20px calc(150px + var(--sb))}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:18px}
.top h1{font-size:2.1rem;line-height:1.05}
.top .date{font-family:var(--serif);font-style:italic;font-size:1.15rem;color:var(--mut)}
.round{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--paper);display:grid;place-items:center;color:var(--sage-d)}
.round.on{background:var(--sage-d);color:#fff;border-color:var(--sage-d)}
.tools{display:flex;gap:8px}

.sec{margin:26px 0 10px;display:flex;align-items:baseline;justify-content:space-between}
.sec h2{font-size:1.4rem}
.link{color:var(--sage-d);font-size:.85rem;font-weight:500}
.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:14px 16px}
.hair{border:0;border-top:1px solid var(--line);margin:0}

/* capture */
.capture{display:flex;align-items:center;gap:8px;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:5px 5px 5px 18px}
.capture input{border:0;padding:8px 0;background:transparent}
.mic{width:42px;height:42px;border-radius:50%;background:var(--sage-d);color:#fff;display:grid;place-items:center;flex:none}
.mic.live{animation:ring 1.3s infinite}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(85,112,92,.5)}100%{box-shadow:0 0 0 16px rgba(85,112,92,0)}}

/* rows */
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border-bottom:0}
.row .tm{width:46px;flex:none;font-size:.78rem;color:var(--mut);text-align:right}
.row .bar{width:3px;align-self:stretch;border-radius:3px;flex:none}
.row .tx{flex:1;min-width:0}
.row .tx b{font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row.done .tx b{text-decoration:line-through;color:var(--mut)}
.chk{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--sage);flex:none;display:grid;place-items:center;color:#fff}
.chk.on{background:var(--sage-d);border-color:var(--sage-d)}
.chk svg{width:13px;height:13px}
.next{font-family:var(--serif);font-style:italic;font-size:1.05rem;color:var(--sage-d)}
.badge{font-size:.72rem;padding:2px 9px;border-radius:99px;background:var(--gold-l);color:#85672f;white-space:nowrap}
.badge.late{background:var(--rose-l);color:#9c5650}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%}
.prog{height:4px;background:var(--line);border-radius:4px;overflow:hidden}
.prog i{display:block;height:100%;border-radius:4px}
.empty{padding:26px 10px;text-align:center;color:var(--mut)}
.empty .art{opacity:.8;margin-bottom:6px}
.sug{display:flex;gap:10px;padding:8px 0;color:var(--ink);font-size:.92rem;cursor:pointer}
.sug svg{color:var(--gold);margin-top:2px}

/* segmented */
.seg{display:flex;background:#efe4da;border-radius:999px;padding:3px;gap:2px}
.seg button{flex:1;padding:7px 4px;border-radius:999px;font-size:.84rem;color:var(--mut);font-weight:500}
.seg button.on{background:var(--paper);color:var(--sage-d);box-shadow:0 1px 4px rgba(60,50,40,.12)}
.nav{display:flex;align-items:center;justify-content:space-between;margin:14px 0}
.nav h2{font-size:1.5rem}
.nav .arr{display:flex;gap:6px;align-items:center}

/* month */
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.mgrid .wd{text-align:center;font-size:.68rem;letter-spacing:.1em;color:var(--mut);padding:4px 0;text-transform:uppercase}
.cell{aspect-ratio:1/1.05;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:6px;gap:3px;font-size:.92rem}
.cell.out{color:#c4b9ad}
.cell.today .n{background:var(--sage-d);color:#fff}
.cell.sel{background:var(--rose-l)}
.cell .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center}
.cell .dots{display:flex;gap:2px;height:6px}
.cell .dots i{width:5px;height:5px;border-radius:50%}
/* year */
.ygrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media(min-width:560px){.ygrid{grid-template-columns:repeat(3,1fr)}}
.ymon h3{font-size:1.1rem;margin-bottom:4px;color:var(--sage-d)}
.ym{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;font-size:.56rem;text-align:center}
.ym span{aspect-ratio:1;display:grid;place-items:center;border-radius:50%}
.ym .has{background:var(--sage);color:#fff}
.ym .has.heavy{background:var(--sage-d)}
.ym .tdy{outline:1.5px solid var(--gold);outline-offset:-1px}
/* week */
.wday{padding:12px 0;border-bottom:1px solid var(--line);display:flex;gap:14px}
.wday .lab{width:48px;flex:none;text-align:center;cursor:pointer}
.wday .lab b{display:block;font-family:var(--serif);font-size:1.5rem;line-height:1}
.wday.today .lab b{color:var(--sage-d)}
.wday .ev{flex:1;min-width:0}
.wday .ev .row{padding:6px 0}

/* areas */
.area{margin-bottom:12px;overflow:hidden;padding:0}
.ahead{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer}
.ahead .sw{width:10px;height:36px;border-radius:5px;flex:none}
.ahead .nm{flex:1;min-width:0}
.ahead h3{font-size:1.25rem}
.abody{padding:0 16px 12px;border-top:1px solid var(--line)}
.area.hid{opacity:.5}
.add{display:flex;gap:8px;margin:12px 0 4px}
.add input{padding:9px 14px;border-radius:999px}

/* tracker */
.habit{padding:14px 0;border-bottom:1px solid var(--line)}
.habit:last-child{border-bottom:0}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px;cursor:pointer}
.hrow b{font-weight:500}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.week div{font-size:.66rem;color:var(--mut);letter-spacing:.08em}
.week button{width:100%;aspect-ratio:1;max-width:40px;margin:4px auto 0;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;color:#fff;background:transparent}
.week button.on{background:var(--sage-d);border-color:var(--sage-d)}
.week button.tdy{border-color:var(--gold)}
.week button svg{width:14px;height:14px}

/* insights */
.hb{display:flex;align-items:center;gap:10px;margin:10px 0;font-size:.9rem}
.hb .l{width:100px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .t{flex:1;height:6px;background:var(--line);border-radius:6px;overflow:hidden}
.hb .t i{display:block;height:100%;border-radius:6px}
.hb .v{width:64px;text-align:right;color:var(--mut);font-size:.82rem}
.cols{display:flex;align-items:flex-end;gap:4px;height:90px;margin-bottom:20px}
.cols div{flex:1;background:var(--sage);opacity:.75;border-radius:4px 4px 0 0;min-height:2px;position:relative}
.cols div span{position:absolute;bottom:-16px;left:0;right:0;text-align:center;font-size:.58rem;color:var(--mut)}
.mapwrap{overflow:auto;border-radius:16px;background:var(--paper);border:1px solid var(--line)}
.mapwrap svg{width:100%;min-width:640px;display:block}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpis.k4{grid-template-columns:repeat(2,1fr)}
input.plain{border:0;background:transparent;padding:6px 0;border-radius:0;flex:1;min-width:0}
.quote{margin:20px 2px 0;padding:4px 0 4px 16px;border-left:2px solid var(--gold);cursor:pointer}
.quote .qt{font-family:var(--serif);font-style:italic;font-size:1.3rem;line-height:1.3;color:var(--ink)}
.quick{display:flex;gap:18px;margin:12px 6px 0}
.quick button{color:var(--sage-d);font-size:.86rem;font-weight:500;display:flex;align-items:center;gap:6px}
.add .round{flex:none;width:38px;height:38px}
.capture .round{width:38px;height:38px;flex:none}
.chips .chip{display:inline-flex;align-items:center}
.kpi{text-align:center;padding:12px 4px;background:var(--paper);border:1px solid var(--line);border-radius:16px}
.kpi b{display:block;font-family:var(--serif);font-size:1.7rem;font-weight:600;color:var(--sage-d);line-height:1.1}
.kpi span{font-size:.7rem;color:var(--mut);letter-spacing:.06em}

/* tab bar, fab */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,251,248,.94);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:var(--sb)}
#tabs .in{max-width:720px;margin:auto;display:flex}
#tabs button{flex:1;padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.66rem;letter-spacing:.06em;color:var(--mut)}
#tabs button.on{color:var(--sage-d);font-weight:500}
#fab{position:fixed;right:max(18px,calc(50% - 342px));bottom:calc(78px + var(--sb));z-index:31;width:54px;height:54px;border-radius:50%;background:var(--sage-d);color:#fff;display:grid;place-items:center;box-shadow:0 6px 18px rgba(60,80,65,.35)}

/* sheet */
#sheet{position:fixed;inset:0;z-index:60;display:none}
#sheet.open{display:block}
.sveil{position:absolute;inset:0;background:rgba(45,55,48,.38)}
.spanel{position:absolute;left:0;right:0;bottom:0;max-width:680px;margin:auto;max-height:93vh;overflow-y:auto;background:var(--paper);border-radius:26px 26px 0 0;padding:8px 20px calc(28px + var(--sb));animation:up .25s ease-out}
@keyframes up{from{transform:translateY(60px);opacity:0}}
.grab{width:42px;height:4px;background:var(--line);border-radius:4px;margin:6px auto 14px}
.sh{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.sh input.ttl{font-family:var(--serif);font-size:1.5rem;font-weight:600;border:0;background:transparent;padding:4px 0}
.fld{margin:14px 0}
.fld>label{display:block;margin-bottom:5px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.box{background:var(--bg);border-radius:16px;padding:12px 14px;margin:16px 0}
.box h4{margin:0 0 8px;font-family:var(--serif);font-size:1.15rem;font-weight:600}
.li{display:flex;align-items:center;gap:10px;padding:6px 0}
.li input[type=checkbox]{width:20px;height:20px;accent-color:var(--sage-d);flex:none}
.li span{flex:1}
.li.d span{text-decoration:line-through;color:var(--mut)}
.x{color:var(--mut);padding:4px}
.btn{background:var(--sage-d);color:#fff;border-radius:999px;padding:10px 20px;font-weight:500;display:inline-flex;gap:8px;align-items:center;justify-content:center}
.btn.ghost{background:transparent;color:var(--sage-d);border:1px solid var(--sage)}
.btn.warn{background:transparent;color:#a15a54;border:1px solid var(--rose)}
.btn.sm{padding:6px 14px;font-size:.84rem}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.swatches{display:flex;gap:10px}
.swatches button{width:34px;height:34px;border-radius:50%;border:2px solid transparent}
.swatches button.on{outline:2px solid var(--ink);outline-offset:2px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:7px 14px;border-radius:999px;border:1px solid var(--sage);color:var(--sage-d);font-size:.88rem}
.chip.on{background:var(--sage-d);color:#fff}
input[type=range]{accent-color:var(--sage-d);padding:0;border:0;background:none}
a{color:var(--sage-d)}
.toggle{display:flex;align-items:center;justify-content:space-between;padding:6px 0}
#toast{position:fixed;left:50%;bottom:calc(140px + var(--sb));transform:translate(-50%,30px);opacity:0;background:var(--ink);color:#fff;padding:11px 20px;border-radius:999px;z-index:90;transition:.3s;max-width:88vw;font-size:.9rem;text-align:center;pointer-events:none}
#toast.show{transform:translate(-50%,0);opacity:1}
</style>
</head>
<body>
<div class="deco a" id="decoA"></div><div class="deco b" id="decoB"></div>
<div id="app"></div>
<nav id="tabs"><div class="in" id="tabsIn"></div></nav>
<button id="fab" aria-label="Add" data-act="capture"></button>
<div id="sheet"><div class="sveil" data-act="closesheet"></div><div class="spanel" id="panel"></div></div>
<div id="toast"></div>
<input type="file" id="file" accept="application/json" hidden>

<script>
/* ================= helpers ================= */
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const fmt=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseD=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const todayStr=()=>fmt(new Date());
const addDays=(n,from)=>{const d=from?parseD(from):new Date();d.setDate(d.getDate()+n);return fmt(d)};
const daysUntil=s=>Math.round((parseD(s)-parseD(todayStr()))/864e5);
const cap=s=>s?s.charAt(0).toUpperCase()+s.slice(1):s;
const DAY=864e5;
const MONTHS=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
const WD=['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
const money=n=>(Math.round(n*100)/100).toLocaleString(undefined,{maximumFractionDigits:2});
const num=s=>parseFloat(String(s).replace(',','.'));
const hrs=m=>m>=60?(Math.round(m/6)/10)+'h':m+'m';
const TONES=['#7d9380','#cf9b95','#b9955b','#5a7156','#a98f7e'];
const NEUTRAL='#b3a597';
const mondayOf=ds=>{const d=parseD(ds);d.setDate(d.getDate()-((d.getDay()+6)%7));return fmt(d)};

const ICON={
 mic:'<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',
 sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4"/>',
 calendar:'<rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',
 leaf:'<path d="M5 19C5 10 10 5 20 5c0 9-5 15-13 15"/><path d="M5 19c3-5 6-8 11-10"/>',
 check:'<circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.7 2.7L16 9.5"/>',
 tick:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',
 chart:'<path d="M4 20V11M10 20V4M16 20v-6M22 20H2"/>',
 l:'<path d="M15 5l-7 7 7 7"/>', r:'<path d="M9 5l7 7-7 7"/>', d:'<path d="M5 9l7 7 7-7"/>',
 x:'<path d="M6 6l12 12M18 6L6 18"/>',
 play:'<path d="M8 5l11 7-11 7z"/>', stop:'<rect x="6" y="6" width="12" height="12" rx="2"/>',
 bell:'<path d="M6 16v-5a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 21h4"/>',
 more:'<circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/>',
 pin:'<path d="M12 21s7-6 7-11a7 7 0 0 0-14 0c0 5 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/>',
 eye:'<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
 eyeoff:'<path d="M3 3l18 18M10.6 6.1A9 9 0 0 1 12 5c6 0 10 7 10 7a17 17 0 0 1-3 3.8M6.5 6.8C3.7 8.6 2 12 2 12s4 7 10 7a9 9 0 0 0 4-1"/>',
 trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',
 spark:'<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/>',
 gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>'
};
const ic=(n,s=20)=>`<svg class="ic" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">${ICON[n]}</svg>`;

/* botanical line art */
function sprig(w=120,h=170,col='#7d9380',acc='#cf9b95'){
  const n=8,pts=[];let leaves='';
  const X=t=>w/2+Math.sin(t*2.4)*9,Y=t=>h-6-t*(h-22);
  for(let k=0;k<=20;k++){const t=k/20;pts.push(`${k?'L':'M'}${X(t).toFixed(1)} ${Y(t).toFixed(1)}`)}
  for(let k=1;k<n;k++){
    const t=k/n,s=1-t*.5,side=k%2?1:-1,fill=k%3===0?acc:col;
    leaves+=`<g transform="translate(${X(t).toFixed(1)} ${Y(t).toFixed(1)}) rotate(${side*(-48+t*14)}) scale(${(side*s).toFixed(2)} ${s.toFixed(2)})"><path d="M0 0C9-12 28-12 42 0 28 12 9 12 0 0Z" fill="${fill}" fill-opacity="${k%3===0?.3:.16}" stroke="${col}" stroke-width="1.1"/><path d="M2 0H37" stroke="${col}" stroke-width=".8"/></g>`;
  }
  const tx=X(1),ty=Y(1);
  const bloom=[0,72,144,216,288].map(a=>`<ellipse cx="${tx}" cy="${ty-8}" rx="4" ry="8" transform="rotate(${a} ${tx} ${ty})" fill="${acc}" fill-opacity=".45" stroke="${acc}" stroke-width=".9"/>`).join('')+`<circle cx="${tx}" cy="${ty}" r="2.6" fill="#b9955b"/>`;

function parseDate(low){
  let m,date=null,phrase=null;
  const nextWd=n=>{const t=new Date();let d=(n-t.getDay()+7)%7;if(d===0)d=7;t.setDate(t.getDate()+d);return fmt(t)};
  const mk=(d,mo)=>{const t=new Date();let y=t.getFullYear();let c=new Date(y,mo,d);if(c<parseD(todayStr()))c=new Date(y+1,mo,d);return fmt(c)};
  if(m=low.match(/\bday after tomorrow\b/)){date=addDays(2);phrase=m[0]}
  else if(m=low.match(/\btomorrow\b/)){date=addDays(1);phrase=m[0]}
  else if(m=low.match(/\b(?:today|tonight)\b/)){date=addDays(0);phrase=m[0]}
  else if(m=low.match(/\bnext week\b/)){date=addDays(7);phrase=m[0]}
  else if(m=low.match(/\bend of (?:the )?month\b/)){const t=new Date();date=fmt(new Date(t.getFullYear(),t.getMonth()+1,0));phrase=m[0]}
  else if(m=low.match(/\bin (\d+) (day|days|week|weeks)\b/)){date=addDays(+m[1]*(m[2][0]==='w'?7:1));phrase=m[0]}
  else if(m=low.match(/\b(?:next |this |on )?(sunday|monday|tuesday|wednesday|thursday|friday|saturday)\b/)){date=nextWd(WD.indexOf(m[1]));phrase=m[0]}
  else if(m=low.match(/\b(\d{1,2})(?:st|nd|rd|th)?\s+(?:of\s+)?(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\b/)){date=mk(+m[1],MONTHS.indexOf(m[2]));phrase=m[0]}
  else if(m=low.match(/\b(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\s+(\d{1,2})(?:st|nd|rd|th)?\b/)){date=mk(+m[2],MONTHS.indexOf(m[1]));phrase=m[0]}
  else if(m=low.match(/\b(\d{1,2})[./](\d{1,2})\b/)){date=mk(+m[1],+m[2]-1);phrase=m[0]}
  return{date,phrase};
}
function parseTime(low){
  let m=low.match(/\b(?:at|@|from)\s*(\d{1,2})(?::(\d{2}))?\s*(am|pm)?\b/)||low.match(/\b(\d{1,2}):(\d{2})\s*(am|pm)?\b/);
  if(!m)return{time:'',phrase:null};
  let h=+m[1];const mi=m[2]?+m[2]:0,ap=m[3];
  if(ap==='pm'&&h<12)h+=12;if(ap==='am'&&h===12)h=0;
  if(!ap&&h>=1&&h<=7)h+=12;
  if(h>23||mi>59)return{time:'',phrase:null};
  return{time:pad(h)+':'+pad(mi),phrase:m[0]};
}

  if(!S.timer)return;const i=item(S.timer.id);const min=Math.max(1,Math.round((Date.now()-S.timer.start)/60000));
  if(i)logTime(i,min);S.timer=null;if(!silent){save();say(`Logged ${hrs(min)}`)}
}
function tick(){const el=$('#timerLive');if(!el)return;if(S.timer){const s=Math.floor((Date.now()-S.timer.start)/1000);el.textContent=pad(Math.floor(s/60))+':'+pad(s%60)}}
setInterval(tick,1000);
function notify(key,title,body){
  if(S.notified[key])return;S.notified[key]=1;persist();say(title+' · '+body);
  if('Notification' in window&&Notification.permission==='granted'){try{new Notification(title,{body})}catch(e){}}
}
function checkReminders(){
  const td=todayStr(),now=new Date();
  for(const i of S.items){if(i.done)continue;
    if(i.due){const d=daysUntil(i.due);
      if(d<0)notify(`late:${i.id}:${td}`,'Overdue',i.title);
      else if(d<=1)notify(`due:${i.id}:${td}`,d===0?'Due today':'Due tomorrow',i.title+(i.next?' — start with '+i.next:''))}
    if(i.remind&&new Date(i.remind)<=now)notify(`rem:${i.id}:${i.remind}`,'Reminder',i.title)}
  for(const e of S.events){if(e.date===td&&e.time){const t=new Date(td+'T'+e.time);const diff=(t-now)/60000;if(diff<=30&&diff>-5)notify(`ev:${e.id}:${td}`,'Coming up',`${e.title} at ${e.time}`)}}
}
setInterval(checkReminders,30000);

/* ================= views ================= */
const fmtLong=ds=>parseD(ds).toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'});
function topbar(title,sub,tools=''){return `<div class="top"><div><h1>${title}</h1>${sub?`<div class="date">${sub}</div>`:''}</div><div class="tools">${tools}</div></div>`}
function emptyBlock(msg,btn){return `<div class="empty"><div class="art">${wreath()}</div>${msg}${btn||''}</div>`}

function entryRow(en,showDate){
  const col=acolor(en.a),a=area(en.a);
  const sub=en.k==='e'?(en.endTime?`${en.time||''} – ${en.endTime}`:'')+(a?(en.endTime?' · ':'')+esc(a.name):''):(a?esc(a.name):'');
  return `<div class="row ${en.done?'done':''}" data-act="${en.k==='e'?'openevent':'openitem'}" data-id="${en.id}">
   <div class="tm">${en.time||(en.multi?'all day':'')}</div><div class="bar" style="background:${col}"></div>
   <div class="tx"><b>${esc(en.t)}</b><span class="sm mut">${en.k==='t'?'Deadline'+(sub?' · '+sub:''):sub||'Event'}</span></div>
   ${en.k==='t'?`<button class="chk ${en.done?'on':''}" data-act="toggle" data-id="${en.id}">${en.done?ic('tick'):''}</button>`:''}</div>`;
}
function habitBlock(ds,kind){
  return S.habits.filter(h=>h.kind===kind).map(h=>{const on=h.days.includes(ds),st=streak(h);
    return `<div class="row" data-act="hday" data-id="${h.id}" data-d="${ds}"><div class="tx"><b>${esc(h.name)}</b><span class="sm mut">${st?st+(kind==='anti'?' days clear':' day streak'):(kind==='anti'?'a fresh start':'start today')}</span></div><span class="chk ${on?'on':''}">${on?ic('tick'):''}</span></div>`}).join('');
}
function habitSections(ds,extra){
  let h='';
  if(S.habits.some(x=>x.kind==='habit'))h+=`<div class="sec"><h2>Habits</h2>${extra||''}</div><div class="card" style="padding:4px 16px">${habitBlock(ds,'habit')}</div>`;
  if(S.habits.some(x=>x.kind==='anti'))h+=`<div class="sec"><h2>Anti-habits</h2><span class="sm mut">tick each day you stay clear</span></div><div class="card" style="padding:4px 16px">${habitBlock(ds,'anti')}</div>`;
  return h;
}
function suggestions(){
  const out=[],open=S.items.filter(i=>!i.done&&!hidden(i.areaId));
  for(const i of open){const d=i.due?daysUntil(i.due):null;
    if(d!==null&&d<0)out.push({t:`${esc(i.title)} is ${-d} day${-d>1?'s':''} overdue — pick one small piece to finish.`,id:i.id,w:100});
    else if(d!==null&&d<=4&&prog(i)<60)out.push({t:`${esc(i.title)} is due in ${d} day${d===1?'':'s'} and ${prog(i)}% done — worth blocking time.`,id:i.id,w:90-d})}
  for(const i of open){if(status(i)==='stalled'&&(Date.now()-i.updated)/DAY>=7)out.push({t:`${esc(i.title)} hasn’t moved in ${Math.floor((Date.now()-i.updated)/DAY)} days${i.next?` — try: ${esc(i.next)}`:''}.`,id:i.id,w:50})}
  for(const i of open){if(!i.next)out.push({t:`Set a “start here next time” for ${esc(i.title)}.`,id:i.id,w:20})}
  for(const a of S.areas){const l=open.filter(i=>i.areaId===a.id&&i.due).sort((x,y)=>x.due.localeCompare(y.due));
    for(let k=0;k<l.length-1;k++){if(Math.abs(daysUntil(l[k+1].due)-daysUntil(l[k].due))<=3&&daysUntil(l[k].due)<=10){out.push({t:`${esc(l[k].title)} and ${esc(l[k+1].title)} (${esc(a.name)}) have close deadlines — one focus block could cover both.`,id:l[k].id,w:45});break}}}
  for(const i of S.items){if(i.budget&&spent(i)>i.budget)out.push({t:`${esc(i.title)} is ${money(spent(i)-i.budget)} over budget.`,id:i.id,w:60})}
  return out.sort((a,b)=>b.w-a.w).slice(0,3);
}

/* ---- calendar ---- */
function calTitle(){
  const v=S.ui.cal,d=parseD(S.ui.date);
  if(v==='day')return d.toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'});
  if(v==='week'){const s=parseD(mondayOf(S.ui.date)),e=new Date(s);e.setDate(e.getDate()+6);return `${s.getDate()} ${s.toLocaleDateString(undefined,{month:'short'})} – ${e.getDate()} ${e.toLocaleDateString(undefined,{month:'short'})}`}
  if(v==='month')return d.toLocaleDateString(undefined,{month:'long',year:'numeric'});
  return String(d.getFullYear());
}
function monthCells(y,m){
  const first=new Date(y,m,1),off=(first.getDay()+6)%7,cells=[];
  for(let k=-off;k<42-off;k++){const d=new Date(y,m,1+k);cells.push({ds:fmt(d),n:d.getDate(),out:d.getMonth()!==m})}
  return cells;
}
function calendarView(){
  const v=S.ui.cal,td=todayStr();
  let h=topbar('Calendar','',`<button class="round" data-act="newevent" aria-label="New event">${ic('plus')}</button>`);
  h+=`<div class="seg">${['day','week','month','year'].map(x=>`<button class="${v===x?'on':''}" data-act="calv" data-id="${x}">${cap(x)}</button>`).join('')}</div>`;
  h+=`<div class="nav"><h2>${calTitle()}</h2><div class="arr"><button class="link" data-act="caltoday">Today</button><button class="round" data-act="calnav" data-n="-1">${ic('l',18)}</button><button class="round" data-act="calnav" data-n="1">${ic('r',18)}</button></div></div>`;
  if(v==='day'){
    const ds=S.ui.date,ent=entriesOn(ds);
    h+=`<div class="card" style="padding:4px 16px">${ent.map(e=>entryRow(e)).join('')||`<div class="empty" style="padding:22px">Nothing planned for this day.</div>`}</div>`;
    h+=habitSections(ds,'<span class="sm mut">this day only</span>');
    h+=`<div class="btns"><button class="btn ghost" data-act="newevent" data-d="${ds}">${ic('plus',16)} Event</button></div>`;
  }else if(v==='week'){
    const s=mondayOf(S.ui.date);
    for(let k=0;k<7;k++){const ds=addDays(k,s),d=parseD(ds),ent=entriesOn(ds);
      h+=`<div class="wday ${ds===td?'today':''}"><div class="lab" data-act="goday" data-d="${ds}"><span class="cap">${d.toLocaleDateString(undefined,{weekday:'short'})}</span><b>${d.getDate()}</b></div><div class="ev">${ent.map(e=>entryRow(e)).join('')||'<div class="mut sm" style="padding:8px 0">—</div>'}</div></div>`}
  }else if(v==='month'){
    const d=parseD(S.ui.date),cells=monthCells(d.getFullYear(),d.getMonth());
    h+=`<div class="mgrid">${['M','T','W','T','F','S','S'].map(x=>`<div class="wd">${x}</div>`).join('')}${cells.map(c=>{
      const ent=c.out?[]:entriesOn(c.ds),cols=[...new Set(ent.map(e=>acolor(e.a)))].slice(0,3);
      return `<button class="cell ${c.out?'out':''} ${c.ds===td?'today':''} ${c.ds===S.ui.sel?'sel':''}" data-act="selday" data-d="${c.ds}"><span class="n">${c.n}</span><span class="dots">${cols.map(x=>`<i style="background:${x}"></i>`).join('')}</span></button>`}).join('')}</div>`;
    const ent=entriesOn(S.ui.sel);
    h+=`<div class="sec"><h2>${fmtLong(S.ui.sel)}</h2><span class="link" data-act="goday" data-d="${S.ui.sel}">Open day</span></div><div class="card" style="padding:4px 16px">${ent.map(e=>entryRow(e)).join('')||`<div class="empty" style="padding:18px">Nothing planned.</div>`}</div>`;
  }else{
    const y=parseD(S.ui.date).getFullYear();
    h+=`<div class="ygrid">${[...Array(12)].map((_,m)=>{const cells=monthCells(y,m);

    <p class="sm mut" style="margin-top:18px">Shaded days have events or deadlines. Tap a month to open it. Daily habits live in the Habits tab and on each day.</p>`;
  }
  return h;

/* ---- insights ---- */
function mapSvg(){
  const W=900,H=620,cx=W/2,cy=H/2,A=S.areas.filter(a=>!a.hidden),n=A.length||1;let g='',lines='';
  A.forEach((a,k)=>{
    const ang=k/n*2*Math.PI-Math.PI/2,ax=cx+Math.cos(ang)*140,ay=cy+Math.sin(ang)*120;
    lines+=`<line x1="${cx}" y1="${cy}" x2="${ax}" y2="${ay}" stroke="${a.color}" stroke-width="2" opacity=".6"/>`;
    const its=S.items.filter(i=>i.areaId===a.id&&!i.done),m=its.length,sp=Math.min(.42,1.0/Math.max(m,1)*(2*Math.PI/n));
    its.forEach((i,j)=>{
      const an=ang+(j-(m-1)/2)*sp,rr=1+(j%2)*.12,ix=cx+Math.cos(an)*330*rr,iy=cy+Math.sin(an)*235*rr,p=prog(i),st=status(i),r=16+p*.14;
      lines+=`<line x1="${ax}" y1="${ay}" x2="${ix}" y2="${iy}" stroke="${a.color}" stroke-width="1" opacity=".5" ${st==='stalled'?'stroke-dasharray="4 4"':''}/>`;
      g+=`<g data-act="openitem" data-id="${i.id}" style="cursor:pointer"><circle cx="${ix}" cy="${iy}" r="${r}" fill="${a.color}" fill-opacity="${st==='stalled'?.25:.55}" stroke="${a.color}" stroke-width="1.5" ${st==='stalled'?'stroke-dasharray="3 3"':''}/><text x="${ix}" y="${iy}" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#35423a">${p}%</text><text x="${ix}" y="${iy+r+14}" text-anchor="middle" font-size="12" fill="#35423a">${esc(i.title.length>20?i.title.slice(0,19)+'…':i.title)}</text></g>`;
    });
    g+=`<g><circle cx="${ax}" cy="${ay}" r="34" fill="#fffbf8" stroke="${a.color}" stroke-width="2"/><text x="${ax}" y="${ay}" text-anchor="middle" dominant-baseline="central" font-family="Cormorant Garamond,serif" font-size="15" font-weight="600" fill="#35423a">${esc(a.name.length>9?a.name.slice(0,8)+'…':a.name)}</text></g>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}">${lines}${g}<circle cx="${cx}" cy="${cy}" r="30" fill="#55705c"/><text x="${cx}" y="${cy}" text-anchor="middle" dominant-baseline="central" font-family="Cormorant Garamond,serif" font-style="italic" font-size="18" fill="#fff">me</text></svg>`;
}
function insightsView(){

function renderSheet(){

  if(sh.type==='item'){const i=item(sh.id);if(!i){S.ui.sheet=null;return renderSheet()}html=`<div class="grab"></div>`+itemSheet(i)}
  else if(sh.type==='event'){const e=evt(sh.id);if(!e){S.ui.sheet=null;return renderSheet()}html=`<div class="grab"></div>`+eventSheet(e)}
  else if(sh.type==='area'){const a=area(sh.id);if(!a){S.ui.sheet=null;return renderSheet()}html=`<div class="grab"></div>`+areaSheet(a)}
  else if(sh.type==='habit'){const h=hab(sh.id);if(!h){S.ui.sheet=null;return renderSheet()}html=`<div class="grab"></div>`+habitSheet(h)}
  else if(sh.type==='goal'){const g=S.goals.find(x=>x.id===sh.id);if(!g){S.ui.sheet=null;return renderSheet()}html=`<div class="grab"></div>`+goalSheet(g)}
  else if(sh.type==='form')html=`<div class="grab"></div>`+formSheet();
  else if(sh.type==='tray')html=`<div class="grab"></div>`+traySheet();
  else if(sh.type==='capture')html=captureSheet();
  else if(sh.type==='settings')html=`<div class="grab"></div>`+settingsSheet();
  const keep={};p.querySelectorAll('[data-keep]').forEach(x=>keep[x.id]=x.value);
  const hadFocus=document.activeElement&&p.contains(document.activeElement)?document.activeElement.id:'';
  p.innerHTML=html;el.classList.add('open');p.scrollTop=sc;
  for(const k in keep){const x=document.getElementById(k);if(x)x.value=keep[k]}

}

function sheetObj(sh){return sh.type==='item'?item(sh.id):sh.type==='event'?evt(sh.id):sh.type==='area'?area(sh.id):sh.type==='habit'?hab(sh.id):sh.type==='goal'?S.goals.find(x=>x.id===sh.id):null}
function applyField(t,live){
  const sh=S.ui.sheet,o=sh&&sheetObj(sh);if(!o)return;
  let v=t.type==='checkbox'?t.checked:t.value;const f=t.dataset.f;
  if(f==='progress'){v=+v;if(v>=100)o.done=true}
  if(f==='budget'||f==='target')v=num(v)||0;
  o[f]=v;if(o.draft&&(f==='title')&&String(v).trim())delete o.draft;
  if(sh.type==='item'){if(live)o.updated=Date.now();else touch(o,f)}
  if(sh.type==='event'&&f==='date')S.ui.sel=v;
  if(live)persist();else save();
}
/* text typed into fields is saved as you type, so nothing is lost if you close the sheet */

function submitInput(t){

  if(!v)return;
  const sh=S.ui.sheet;
  if(t.dataset.newdep!==undefined&&sh){const g=S.goals.find(x=>x.id===sh.id);const m=v.match(/^([-−]?\d+(?:[.,]\d+)?)\s*(.*)$/);if(m){g.dep.push({id:uid(),amt:num(m[1].replace('−','-')),d:todayStr(),note:cap(m[2]||'')});save()}else say('Start with the amount, e.g. 50 birthday money');return}
  if(t.dataset.add){const a=area(t.dataset.add),before=S.items.length;handle(v+' in '+a.name.toLowerCase());
    if(S.items.length>before){S.items[S.items.length-1].areaId=a.id;save()}}
  else if(t.dataset.idea!==undefined){S.ideas.unshift({id:uid(),t:cap(v),d:Date.now()});save()}
  else if(t.dataset.misc!==undefined){const m=v.match(/^(.*?)\s*(\d+(?:[.,]\d+)?)$/);if(m){S.misc.push({id:uid(),label:cap(m[1]||'Expense'),amt:num(m[2]),d:todayStr()});save()}else say('Format: label amount')}
  else if(t.dataset.newstep!==undefined&&sh){const i=item(sh.id);i.steps.push({id:uid(),t:cap(v),done:false});i.done=false;touch(i,'step');save();const n=document.querySelector('[data-newstep]');n&&n.focus()}
  else if(t.dataset.newexp!==undefined&&sh){const i=item(sh.id);const m=v.match(/^(.*?)\s*(\d+(?:[.,]\d+)?)$/);if(m){i.exp.push({id:uid(),label:cap(m[1]||'Expense'),amt:num(m[2]),d:todayStr()});touch(i,'budget');save()}else say('Format: label amount')}
  else if(t.dataset.newres!==undefined&&sh){const i=item(sh.id);const url=/^https?:\/\//i.test(v)?v:'https://'+v;i.res.push({id:uid(),label:v.replace(/^https?:\/\//i,'').slice(0,42),url});save()}
}

function payload(){const p={};for(const c of COLL)p[c]=S[c];p.time=S.time;p.log=S.log;p.allowance=S.allowance;p.u=S.u;p.del=S.del;return p}
function mergeP(L,R){
  const o={u:{},del:{}},lu=L.u||{},ru=R.u||{};
  const del=Object.assign({},L.del);for(const k in (R.del||{}))del[k]=Math.max(del[k]||0,R.del[k]);
  for(const c of COLL){
    const rm=new Map((R[c]||[]).map(x=>[x.id,x])),lm=new Map((L[c]||[]).map(x=>[x.id,x])),out=[];
    for(const id of [...rm.keys(),...[...lm.keys()].filter(k=>!rm.has(k))]){
      const a=lm.get(id),b=rm.get(id),la=lu[id]||0,ra=ru[id]||0,mu=Math.max(la,ra);
      if(del[id]&&del[id]>=mu)continue;
      out.push(a&&b?(la>ra?a:b):(a||b));o.u[id]=mu;
    }
    o[c]=out;
  }
  o.allowance=(lu._set||0)>(ru._set||0)?L.allowance:R.allowance;o.u._set=Math.max(lu._set||0,ru._set||0);
  const tk=new Map();for(const t of [...(R.time||[]),...(L.time||[])])if(t.k&&!tk.has(t.k))tk.set(t.k,t);o.time=[...tk.values()];
  const lk=new Map();for(const l of [...(R.log||[]),...(L.log||[])]){const k=l.t+':'+l.id+':'+l.type;if(!lk.has(k))lk.set(k,l)}
  o.log=[...lk.values()].sort((a,b)=>a.t-b.t).slice(-3000);
  o.del=del;return o;
}
function canon(p){
  const q={};for(const c of COLL)q[c]=(p[c]||[]).map(x=>[x.id,JSON.stringify(x)]).sort((a,b)=>a[0]<b[0]?-1:1);
  q.time=(p.time||[]).map(t=>t.k).sort();q.log=(p.log||[]).map(l=>l.t+l.id+l.type).sort();q.allowance=p.allowance||0;
  q.del=Object.keys(p.del||{}).sort();return JSON.stringify(q);
}
function applyMerged(m){
  for(const c of COLL)S[c]=m[c];S.time=m.time;S.log=m.log;S.allowance=m.allowance;S.u=m.u;S.del=m.del;
  S.h={};for(const c of COLL)for(const o of S[c])S.h[o.id]=hs(JSON.stringify(o));S.h._set=hs(JSON.stringify(SETV()));S.h._tl=hs(JSON.stringify(TLV()));
  S.habits.forEach(h=>{if(!h.kind)h.kind='habit'});store();
}
const ghApi=(path,opt={})=>fetch('https://api.github.com/repos/'+SY.repo+path,Object.assign({cache:'no-store'},opt,{headers:{'Authorization':'Bearer '+SY.token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'}}));
function syncText(){
  if(!syncOn())return'';if(syncing)return'Syncing…';if(SY.err)return'Sync problem: '+SY.err;
  return SY.last?'Synced '+new Date(SY.last).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):'Connected';
}
const syncBadge=()=>syncOn()?` · <span id="syncStatus" data-act="syncnow" style="cursor:pointer">${esc(syncText())}</span>`:'';
function paintSync(){document.querySelectorAll('#syncStatus,#syncStatus2').forEach(el=>el.textContent=syncText())}
async function syncNow(manual){
  if(!syncOn())return;
  if(syncing){syncAgain=true;return}
  syncing=true;paintSync();let changedLocal=false;
  try{
    for(let attempt=0;attempt<3;attempt++){
      const r=await ghApi('/contents/bloom.json?cb='+Date.now());
      let remote=null,sha=null;
      if(r.status===200){const j=await r.json();sha=j.sha;remote=JSON.parse(b64d(j.content))}
      else if(r.status===404){const rr=await ghApi('');if(rr.status===404)throw new Error('Repository not found — check the name and token access');if(rr.status===401)throw new Error('Token rejected — it may have expired, been revoked or been copied incompletely')}
      else throw new Error(r.status===401?'Token rejected — it may have expired, been revoked or been copied incompletely':r.status===403?'Token lacks access':'GitHub '+r.status);
      stamp();const local=payload();
      const merged=remote?mergeP(local,remote):local;
      if(remote&&canon(merged)!==canon(local)){applyMerged(merged);changedLocal=true}
      if(!remote||canon(merged)!==canon(remote)){
        const body={message:'sync',content:b64e(JSON.stringify(merged))};if(sha)body.sha=sha;
        const pr=await ghApi('/contents/bloom.json',{method:'PUT',body:JSON.stringify(body)});
        if(pr.status===409||pr.status===422)continue;
        if(!pr.ok)throw new Error(pr.status===403||pr.status===404?'Token needs Contents: read & write':'GitHub '+pr.status);
      }
      SY.last=Date.now();SY.err='';saveSY();break;
    }
  }catch(e){SY.err=String(e.message||e).replace(/^TypeError: /,'')==='Failed to fetch'?'offline':String(e.message||e);saveSY()}
  syncing=false;paintSync();
  if(changedLocal){const a=document.activeElement;if(!(a&&a.closest&&a.closest('#panel')&&['INPUT','TEXTAREA'].includes(a.tagName)))render()}
  if(syncAgain){syncAgain=false;scheduleSync()}
  if(manual)say(SY.err?'Sync problem: '+SY.err:'Synced');
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)syncNow()});
window.addEventListener('online',()=>syncNow());
setInterval(()=>{if(!document.hidden)syncNow()},60000);

/* ================= boot ================= */
if(location.hash.startsWith('#sync=')){
  try{const[r,tk]=decodeURIComponent(location.hash.slice(6)).split('|');if(r&&tk){SY={repo:r.trim(),token:cleanTok(tk)};saveSY();say('Sync connected on this device')}}catch(e){}
  history.replaceState(null,'',location.pathname+location.search);
}
setTimeout(()=>syncNow(),600);
$('#decoA').innerHTML=sprig(150,230);$('#decoB').innerHTML=sprig(170,260,'#b9955b','#cf9b95');
$('#fab').innerHTML=ic('plus',24);
render();checkReminders();
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){navigator.serviceWorker.register('sw.js').catch(()=>{})}
